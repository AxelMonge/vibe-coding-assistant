[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
build_flags =
  -DCORE_DEBUG_LEVEL=4
lib_deps =
    links2004/WebSockets@^2.4.1
    https://github.com/pschatzmann/ESP32-A2DP.git
board_build.partitions = huge_app.csv
